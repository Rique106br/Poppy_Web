<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Playtime: Capítulo 1 & 2 - Monster Update</title>
  <style>
    * { box-sizing: border-box; touch-action: none; margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; }
    
    #touch-look {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 1;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
      background: rgba(255,255,255,0.7); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    
    #joystick-container {
      position: absolute; bottom: 30px; left: 30px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; z-index: 10;
    }
    #joystick-knob {
      position: absolute; top: 50%; left: 50%; width: 45px; height: 45px;
      background: rgba(255, 255, 255, 0.5); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
    }

    #interact-btn {
      position: absolute; bottom: 40px; right: 40px; width: 85px; height: 85px;
      background: rgba(255, 204, 0, 0.2); border: 2px solid #ffcc00; border-radius: 50%;
      color: #ffcc00; font-weight: bold; font-size: 11px; z-index: 10;
      display: none; align-items: center; justify-content: center; text-align: center;
      text-shadow: 0 0 5px #ffcc00;
    }
    #interact-btn:active { background: rgba(255, 204, 0, 0.5); }

    #hud-info {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      z-index: 10; pointer-events: none;
    }
    #zone-title { color: #777; font-size: 11px; letter-spacing: 2px; text-align: center; }
    #inventory-status { color: #ff4444; font-size: 11px; letter-spacing: 1px; }

    /* Botão Debug em Tempo Real */
    #debug-toggle {
      position: absolute; top: 15px; right: 15px; background: rgba(255,0,0,0.4);
      border: 1px solid #ff0000; color: #fff; font-size: 10px; font-family: inherit;
      padding: 6px 10px; z-index: 30; border-radius: 3px;
    }

    #note-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 400px; background: #ece5d8; color: #1a1a1a;
      padding: 22px; border-radius: 4px; box-shadow: 0 0 30px rgba(0,0,0,0.9);
      display: none; z-index: 20; border: 1px solid #c4b59d;
    }
    #note-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #aaa; padding-bottom: 4px; }
    #note-body { font-size: 12px; line-height: 1.5; margin-bottom: 18px; white-space: pre-wrap; }
    #note-close {
      background: #2b2b2b; color: #fff; border: none; padding: 8px 16px;
      font-size: 12px; font-family: inherit; width: 100%; border-radius: 2px;
    }

    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 5, 8, 0.95); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      color: #ffcc00; text-align: center; padding: 20px;
    }
    #start-overlay h1 { font-size: 20px; letter-spacing: 3px; margin-bottom: 10px; }
    #start-overlay p { font-size: 12px; color: #aaa; margin-bottom: 20px; line-height: 1.5; }
    
    .debug-box {
      margin-bottom: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #00ffcc;
    }
    .debug-box input { width: 18px; height: 18px; }

    #start-btn {
      padding: 12px 28px; background: #ffcc00; color: #000; border: none;
      font-weight: bold; font-family: inherit; font-size: 14px; border-radius: 3px;
    }

    #chapter-splash {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      color: #ff2222; font-size: 22px; letter-spacing: 4px; text-shadow: 0 0 10px #ff0000;
      display: none; z-index: 50; text-align: center; pointer-events: none;
    }

    #jumpscare {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #ff0000; display: none; z-index: 200;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="start-overlay">
    <h1>PLAYTIME CO.</h1>
    <p>O protótipo escapou para os corredores inferiores.<br>Ative o modo debug para congelá-lo durante os testes.</p>
    
    <label class="debug-box">
      <input type="checkbox" id="debug-checkbox" checked>
      MODO DEBUG: CONGELAR BICHO
    </label>

    <button id="start-btn">INICIAR JOGO</button>
  </div>

  <div id="jumpscare"></div>
  <button id="debug-toggle">DEBUG: BICHO TRAVADO</button>

  <div id="chapter-splash">CAPÍTULO 2<br><span style="font-size: 13px; color:#aaa;">O ABISMO DOS PROTÓTIPOS</span></div>

  <div id="touch-look"></div>
  <div id="crosshair"></div>
  
  <div id="hud-info">
    <div id="zone-title">SETOR A: RECEPÇÃO COMERCIAL</div>
    <div id="inventory-status">[ CHAVE: NENHUMA ]</div>
  </div>
  
  <div id="joystick-container">
    <div id="joystick-knob"></div>
  </div>

  <div id="interact-btn">INTERAGIR</div>

  <div id="note-modal">
    <div id="note-title">REGISTRO INTERNO</div>
    <div id="note-body">...</div>
    <button id="note-close">FECHAR REGISTRO</button>
  </div>

  <script>
    // --- ESTADO GERAL & DEBUG ---
    let isMonsterFrozen = true;
    let hasKey = false;
    let doorOpened = false;
    let elevatorMoving = false;
    let currentChapter = 1;

    // --- MOTOR DE ÁUDIO NATIVO ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playFootstep(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      if (type === 'metal') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(0.18, now);
      } else if (type === 'water') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.09);
        gain.gain.setValueAtTime(0.14, now);
      }
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    function playMonsterRoar() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(70, now);
      osc.frequency.linearRampToValueAtTime(30, now + 1.2);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 1.3);
    }

    function playElevatorHum() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(40, now);
      osc.frequency.linearRampToValueAtTime(55, now + 3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 5.0);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 5.2);
    }

    function playDoorOpen() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(70, now + 0.4);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playPickup() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    // --- CENA THREE.JS ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x040407, 0.055);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 80);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const flashlight = new THREE.SpotLight(0xffeedd, 2.8, 28, Math.PI / 5, 0.4);
    camera.add(flashlight);
    flashlight.position.set(0, 0, 0);
    flashlight.target = camera;
    scene.add(camera);

    const ambientLight = new THREE.AmbientLight(0x111119, 0.4);
    scene.add(ambientLight);

    const elevatorLight = new THREE.PointLight(0xff1100, 0, 10);
    elevatorLight.position.set(0, -4.5, -57);
    scene.add(elevatorLight);

    // Materiais
    const matWood = new THREE.MeshStandardMaterial({ color: 0x332014, roughness: 0.8 });
    const matWallStore = new THREE.MeshStandardMaterial({ color: 0x242e35, roughness: 0.9 });
    const matConcrete = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.95 });
    const matMetal = new THREE.MeshStandardMaterial({ color: 0x33333d, metalness: 0.8, roughness: 0.3 });
    const matDeepFloor = new THREE.MeshStandardMaterial({ color: 0x0a0c0e, roughness: 0.3, metalness: 0.4 });

    // --- ESTRUTURA DO MAPA (LOJA E SUBSOLO) ---
    const shopFloor = new THREE.Mesh(new THREE.PlaneGeometry(24, 30), matWood);
    shopFloor.rotation.x = -Math.PI / 2;
    shopFloor.position.set(0, 0, 5);
    scene.add(shopFloor);

    function createWall(w, h, d, x, y, z) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWallStore);
      wall.position.set(x, y, z);
      scene.add(wall);
    }
    createWall(24, 6, 0.5, 0, 3, 20);
    createWall(0.5, 6, 30, -12, 3, 5);
    createWall(0.5, 6, 30, 12, 3, 5);

    const ramp = new THREE.Mesh(new THREE.PlaneGeometry(8, 16), matConcrete);
    ramp.rotation.x = -Math.PI / 2 + 0.375;
    ramp.position.set(0, -3, -16);
    scene.add(ramp);

    const subFloor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), matConcrete);
    subFloor.rotation.x = -Math.PI / 2;
    subFloor.position.set(0, -6, -37);
    scene.add(subFloor);

    // Bancada e Chave Vermelha
    const desk = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 1.5), matMetal);
    desk.position.set(8, -5.5, -40);
    scene.add(desk);

    const keyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.5), new THREE.MeshBasicMaterial({ color: 0xff1122 }));
    keyMesh.position.set(8, -4.95, -40);
    scene.add(keyMesh);

    // Divisória e Porta
    const wallElevatorBack = new THREE.Mesh(new THREE.BoxGeometry(30, 8, 0.8), matMetal);
    wallElevatorBack.position.set(0, -2, -52);
    scene.add(wallElevatorBack);

    const door = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 0.4), new THREE.MeshStandardMaterial({ color: 0x662222, metalness: 0.7 }));
    door.position.set(0, -3.5, -51.8);
    scene.add(door);

    const elevatorPanel = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.2), new THREE.MeshBasicMaterial({ color: 0x33ff33 }));
    elevatorPanel.position.set(2.5, -4.0, -57);
    scene.add(elevatorPanel);

    const elevatorCabin = new THREE.Group();
    const elevFloor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), matMetal);
    elevFloor.rotation.x = -Math.PI / 2;
    elevatorCabin.add(elevFloor);
    elevatorCabin.position.set(0, -6, -57);
    scene.add(elevatorCabin);

    // --- CAPÍTULO 2 ---
    const deepFloor = new THREE.Mesh(new THREE.PlaneGeometry(40, 50), matDeepFloor);
    deepFloor.rotation.x = -Math.PI / 2;
    deepFloor.position.set(0, -24, -80);
    scene.add(deepFloor);

    for (let r = -1; r <= 1; r += 2) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 45), matMetal);
      rail.position.set(r * 1.5, -23.9, -80);
      scene.add(rail);
    }

    // --- CRIATURA / BICHO (ESPÉCIME CUDDLE) ---
    const monsterGroup = new THREE.Group();
    const matMonsterBody = new THREE.MeshStandardMaterial({ color: 0x0a2244, roughness: 0.9 }); // Azul escuro orgânico
    const matEye = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const matMouth = new THREE.MeshBasicMaterial({ color: 0x550000 });

    // Tronco alongado
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 2.2, 8), matMonsterBody);
    torso.position.y = 2.0;
    monsterGroup.add(torso);

    // Cabeça
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 8), matMonsterBody);
    head.position.y = 3.3;
    monsterGroup.add(head);

    // Olhos fluorescentes
    const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), matEye);
    eye1.position.set(0.18, 3.4, 0.38);
    const eye2 = eye1.clone();
    eye2.position.x = -0.18;
    monsterGroup.add(eye1);
    monsterGroup.add(eye2);

    // Boca
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.1), matMouth);
    mouth.position.set(0, 3.15, 0.4);
    monsterGroup.add(mouth);

    // Braços longos
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.15), matMonsterBody);
    armL.position.set(0.55, 1.8, 0);
    const armR = armL.clone();
    armR.position.x = -0.55;
    monsterGroup.add(armL);
    monsterGroup.add(armR);

    // Posição inicial da criatura: Fundo do Subsolo
    monsterGroup.position.set(0, -6, -45);
    scene.add(monsterGroup);

    // --- LORE ---
    const notes = [];
    const noteGeo = new THREE.PlaneGeometry(0.4, 0.55);
    const noteMat = new THREE.MeshBasicMaterial({ color: 0xfff3db, side: THREE.DoubleSide });

    function addNote(x, y, z, rotX, rotY, title, text) {
      const mesh = new THREE.Mesh(noteGeo, noteMat);
      mesh.position.set(x, y, z);
      mesh.rotation.x = rotX;
      mesh.rotation.y = rotY;
      scene.add(mesh);
      notes.push({ mesh, title, text });
    }

    addNote(7.5, -4.95, -40, -Math.PI / 2, 0,
      "REGISTRO DO ELEVADOR",
      "A chave vermelha foi deixada na bancada médica. Cuidado com o espécime solto na área de estoque.\n\nUse o painel para descer a cabine até o Setor B."
    );

    addNote(0, -23.9, -75, -Math.PI / 2, 0,
      "ARQUIVO CAPÍTULO 2",
      "Você desceu ao Abismo dos Protótipos.\n\nO sistema biológico foi totalmente corrompido."
    );

    // --- INTERAÇÃO E HUD ---
    const raycaster = new THREE.Raycaster();
    const interactBtn = document.getElementById('interact-btn');
    const noteModal = document.getElementById('note-modal');
    const noteTitle = document.getElementById('note-title');
    const noteBody = document.getElementById('note-body');
    const noteClose = document.getElementById('note-close');
    const invStatus = document.getElementById('inventory-status');
    const title = document.getElementById('zone-title');
    const chapterSplash = document.getElementById('chapter-splash');
    const debugToggle = document.getElementById('debug-toggle');
    const jumpscare = document.getElementById('jumpscare');

    let interactTarget = null;
    let targetData = null;

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      isMonsterFrozen = document.getElementById('debug-checkbox').checked;
      updateDebugButton();
      document.getElementById('start-overlay').style.display = 'none';
    });

    debugToggle.addEventListener('click', () => {
      isMonsterFrozen = !isMonsterFrozen;
      updateDebugButton();
    });

    function updateDebugButton() {
      if (isMonsterFrozen) {
        debugToggle.innerText = "DEBUG: BICHO TRAVADO";
        debugToggle.style.background = "rgba(0, 200, 100, 0.4)";
        debugToggle.style.borderColor = "#00ff88";
      } else {
        debugToggle.innerText = "DEBUG: BICHO ATIVO";
        debugToggle.style.background = "rgba(255, 0, 0, 0.4)";
        debugToggle.style.borderColor = "#ff0000";
      }
    }

    noteClose.addEventListener('click', () => {
      noteModal.style.display = 'none';
    });

    interactBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!interactTarget) return;

      if (interactTarget === 'note') {
        noteTitle.innerText = targetData.title;
        noteBody.innerText = targetData.text;
        noteModal.style.display = 'block';
      } else if (interactTarget === 'key') {
        hasKey = true;
        scene.remove(keyMesh);
        invStatus.innerText = "[ CHAVE: CARTÃO VERMELHO ]";
        invStatus.style.color = "#33ff33";
        playPickup();
      } else if (interactTarget === 'door') {
        if (hasKey) {
          doorOpened = true;
          playDoorOpen();
        }
      } else if (interactTarget === 'elevator') {
        if (!elevatorMoving && currentChapter === 1) {
          startElevatorDescent();
        }
      }
    });

    function startElevatorDescent() {
      elevatorMoving = true;
      playElevatorHum();
      elevatorLight.intensity = 2.0;

      let descentInterval = setInterval(() => {
        camera.position.y -= 0.12;
        elevatorCabin.position.y -= 0.12;
        elevatorLight.position.y -= 0.12;

        if (Math.random() > 0.5) {
          elevatorLight.intensity = elevatorLight.intensity > 0.5 ? 0.2 : 2.5;
        }

        if (camera.position.y <= -22.4) {
          clearInterval(descentInterval);
          camera.position.y = -22.4;
          elevatorCabin.position.y = -24;
          elevatorMoving = false;
          elevatorLight.intensity = 0;
          currentChapter = 2;

          // Se estiver no Cap 2, reposicionar o bicho no abismo se ele estiver solto
          monsterGroup.position.set(0, -24, -90);

          chapterSplash.style.display = 'block';
          setTimeout(() => { chapterSplash.style.display = 'none'; }, 3500);
        }
      }, 30);
    }

    // --- CONTROLES DE TOQUE MOBILE ---
    let touchX = 0, touchY = 0;
    let yaw = 0, pitch = 0;
    const lookArea = document.getElementById('touch-look');

    lookArea.addEventListener('touchstart', (e) => {
      touchX = e.changedTouches[0].clientX;
      touchY = e.changedTouches[0].clientY;
    });

    lookArea.addEventListener('touchmove', (e) => {
      const t = e.changedTouches[0];
      yaw -= (t.clientX - touchX) * 0.005;
      pitch -= (t.clientY - touchY) * 0.005;
      pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
      touchX = t.clientX;
      touchY = t.clientY;
    });

    const joyContainer = document.getElementById('joystick-container');
    const knob = document.getElementById('joystick-knob');
    let moveVector = { x: 0, y: 0 };
    let joyId = null;

    joyContainer.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      joyId = t.identifier;
      handleJoy(t);
    });

    window.addEventListener('touchmove', (e) => {
      if (joyId === null) return;
      for (let t of e.changedTouches) {
        if (t.identifier === joyId) handleJoy(t);
      }
    });

    const stopJoy = () => {
      joyId = null;
      moveVector = { x: 0, y: 0 };
      knob.style.transform = `translate(-50%, -50%)`;
    };
    window.addEventListener('touchend', stopJoy);
    window.addEventListener('touchcancel', stopJoy);

    function handleJoy(t) {
      const rect = joyContainer.getBoundingClientRect();
      const dx = Math.min(Math.max(t.clientX - (rect.left + rect.width / 2), -rect.width / 2), rect.width / 2);
      const dy = Math.min(Math.max(t.clientY - (rect.top + rect.height / 2), -rect.height / 2), rect.height / 2);
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      moveVector.x = dx / (rect.width / 2);
      moveVector.y = dy / (rect.height / 2);
    }

    // --- TRIGGER DE MORTE / JUMPSCARE ---
    let dead = false;
    function triggerDeath() {
      if (dead) return;
      dead = true;
      playMonsterRoar();
      jumpscare.style.display = 'block';

      setTimeout(() => {
        jumpscare.style.display = 'none';
        camera.position.set(0, 1.6, 12);
        monsterGroup.position.set(0, -6, -45);
        dead = false;
      }, 1500);
    }

    // --- LOOP PRINCIPAL ---
    camera.position.set(0, 1.6, 12);
    let stepTimer = 0;

    function animate() {
      requestAnimationFrame(animate);

      camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

      if (doorOpened && door.position.x < 3.8) {
        door.position.x += 0.08;
      }

      // Movimentação do Jogador
      const isMoving = (Math.abs(moveVector.x) > 0.1 || Math.abs(moveVector.y) > 0.1) && !elevatorMoving && !dead;

      if (isMoving) {
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.position.addScaledVector(forward, -moveVector.y * 0.075);
        camera.position.addScaledVector(right, moveVector.x * 0.075);

        stepTimer++;
        if (stepTimer > 24) {
          playFootstep(currentChapter === 2 ? 'water' : (camera.position.z < -20 ? 'metal' : 'wood'));
          stepTimer = 0;
        }
      }

      // Alturas das Zonas
      if (!elevatorMoving && !dead) {
        let targetY = 1.6;
        if (currentChapter === 1) {
          if (camera.position.z > -8) {
            targetY = 1.6;
            title.innerText = "CAPÍTULO 1 - RECEPÇÃO";
          } else if (camera.position.z <= -8 && camera.position.z >= -24) {
            const t = (camera.position.z - (-8)) / (-16);
            targetY = 1.6 - (t * 6.0);
            title.innerText = "CAPÍTULO 1 - RAMPA DE DESCARGA";
          } else {
            targetY = -4.4;
            title.innerText = "CAPÍTULO 1 - SUBSOLO INDUSTRIAL";
          }
          camera.position.y += (targetY - camera.position.y) * 0.15;
        } else {
          targetY = -22.4;
          title.innerText = "CAPÍTULO 2 - ABISMO DOS PROTÓTIPOS";
          camera.position.y += (targetY - camera.position.y) * 0.15;
        }
      }

      // --- COMPORTAMENTO DA CRIATURA / IA ---
      if (!isMonsterFrozen && !elevatorMoving && !dead) {
        // O monstro sempre olha em direção à câmera
        monsterGroup.lookAt(camera.position.x, monsterGroup.position.y, camera.position.z);

        const distToPlayer = monsterGroup.position.distanceTo(camera.position);

        // Só persegue se o jogador estiver no mesmo piso (subsolo ou cap 2)
        const inSameFloor = (currentChapter === 1 && camera.position.z < -18) || currentChapter === 2;

        if (inSameFloor) {
          // Movimento suave em direção ao jogador
          const dir = new THREE.Vector3().subVectors(camera.position, monsterGroup.position).normalize();
          monsterGroup.position.x += dir.x * 0.04;
          monsterGroup.position.z += dir.z * 0.04;

          // Animação de caminhada sinistra (balançar os braços)
          armL.rotation.x = Math.sin(Date.now() * 0.008) * 0.4;
          armR.rotation.x = -Math.sin(Date.now() * 0.008) * 0.4;

          // Se encostar no jogador -> Morte
          if (distToPlayer < 2.0) {
            triggerDeath();
          }
        }
      }

      // --- MIRA / RAYCASTING ---
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hitNotes = raycaster.intersectObjects(notes.map(n => n.mesh));
      const hitKey = !hasKey ? raycaster.intersectObject(keyMesh) : [];
      const hitDoor = !doorOpened ? raycaster.intersectObject(door) : [];
      const hitPanel = (currentChapter === 1 && !elevatorMoving) ? raycaster.intersectObject(elevatorPanel) : [];

      if (hitNotes.length > 0 && hitNotes[0].distance < 3.8) {
        interactTarget = 'note';
        targetData = notes.find(n => n.mesh === hitNotes[0].object);
        interactBtn.innerText = "LER";
        interactBtn.style.display = 'flex';
      } else if (hitKey.length > 0 && hitKey[0].distance < 3.5) {
        interactTarget = 'key';
        interactBtn.innerText = "PEGAR CHAVE";
        interactBtn.style.display = 'flex';
      } else if (hitDoor.length > 0 && hitDoor[0].distance < 4.0) {
        interactTarget = 'door';
        interactBtn.innerText = hasKey ? "ABRIR PORTA" : "[TRANCADA]";
        interactBtn.style.display = 'flex';
      } else if (hitPanel.length > 0 && hitPanel[0].distance < 4.5) {
        interactTarget = 'elevator';
        interactBtn.innerText = "DESCER ELEVADOR";
        interactBtn.style.display = 'flex';
      } else {
        interactTarget = null;
        interactBtn.style.display = 'none';
      }

      // Flicker da Lanterna
      if (Math.random() > 0.985) {
        flashlight.intensity = 1.8 + Math.random() * 1.2;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
